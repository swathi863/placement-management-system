{% extends 'base.html' %}

{% block title %}Forgot Password - Placement Portal{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="stat-icon blue" style="margin: 0 auto 0.75rem auto;">🔑</div>
      <h1 class="page-title" style="font-size: 1.5rem;">Reset Your Password</h1>
      <p class="page-subtitle">Enter your email address and we'll send you a password reset link</p>
    </div>

    <form action="{{ url_for('auth.forgot_password') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="role">Account Role</label>
        <select id="role" name="role" class="form-select">
          <option value="student" {% if role == 'student' %}selected{% endif %}>Student Account</option>
          <option value="admin" {% if role == 'admin' %}selected{% endif %}>Admin Account</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Registered Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="your.name@univ.edu" value="{{ email or '' }}" required autofocus>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Send Password Reset Link</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
      Remember your password? <a href="{{ url_for('auth.student_login') }}" style="font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
