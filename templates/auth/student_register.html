{% extends 'base.html' %}

{% block title %}Student Registration - Placement Portal{% endblock %}

{% block content %}
<div style="max-width: 620px; margin: 1.5rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="stat-icon blue" style="margin: 0 auto 0.75rem auto;">✍️</div>
      <h1 class="page-title" style="font-size: 1.5rem;">Student Registration</h1>
      <p class="page-subtitle">Create your account to start applying for campus drives</p>
    </div>

    <form action="{{ url_for('auth.student_register') }}" method="POST">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="name">Full Name *</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="e.g. John Doe" value="{{ name or '' }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">University Email *</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="john.doe@univ.edu" value="{{ email or '' }}" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">Password *</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="text" id="phone" name="phone" class="form-control" placeholder="+1 (555) 000-0000" value="{{ phone or '' }}">
        </div>
        <div class="form-group">
          <label class="form-label" for="branch">Engineering Branch *</label>
          <select id="branch" name="branch" class="form-select" required>
            <option value="Computer Science" {% if branch == 'Computer Science' %}selected{% endif %}>Computer Science</option>
            <option value="Information Technology" {% if branch == 'Information Technology' %}selected{% endif %}>Information Technology</option>
            <option value="Electronics" {% if branch == 'Electronics' %}selected{% endif %}>Electronics</option>
            <option value="Mechanical" {% if branch == 'Mechanical' %}selected{% endif %}>Mechanical</option>
            <option value="Civil" {% if branch == 'Civil' %}selected{% endif %}>Civil</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="cgpa">Current CGPA (0.0 - 10.0)</label>
          <input type="number" step="0.1" min="0" max="10" id="cgpa" name="cgpa" class="form-control" placeholder="8.5" value="{{ cgpa or '' }}">
        </div>
        <div class="form-group">
          <label class="form-label" for="grad_year">Graduation Year</label>
          <input type="number" id="grad_year" name="grad_year" class="form-control" placeholder="2026" value="{{ grad_year or '2026' }}">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="skills">Technical Skills (Comma separated)</label>
        <input type="text" id="skills" name="skills" class="form-control" placeholder="Python, JavaScript, SQL, Flask" value="{{ skills or '' }}">
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Complete Registration</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('auth.student_login') }}" style="font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
