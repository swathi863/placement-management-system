{% extends 'base.html' %}

{% block title %}Admin Login - Placement Portal{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
  <div class="card" style="padding: 2.25rem; border-top: 4px solid #d97706;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="stat-icon amber" style="margin: 0 auto 0.75rem auto;">🛡️</div>
      <h1 class="page-title" style="font-size: 1.5rem;">Admin Login</h1>
      <p class="page-subtitle">Administrator credentials required</p>
    </div>

    <form action="{{ url_for('auth.admin_login') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="email">Admin Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="admin@placement.com" value="{{ email or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
          <a href="{{ url_for('auth.forgot_password', role='admin') }}" style="font-size: 0.8rem; font-weight: 500; color: #b45309;">Forgot Password?</a>
        </div>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-secondary btn-full" style="margin-top: 1rem; border-color: #d97706; color: #b45309; background-color: #fffbeb;">
        Access Admin Portal
      </button>
    </form>
  </div>
</div>
{% endblock %}
