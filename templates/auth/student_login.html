{% extends 'base.html' %}

{% block title %}Student Login - Placement Portal{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="stat-icon blue" style="margin: 0 auto 0.75rem auto;">🎓</div>
      <h1 class="page-title" style="font-size: 1.5rem;">Student Login</h1>
      <p class="page-subtitle">Access your placement dashboard & applications</p>
    </div>

    <form action="{{ url_for('auth.student_login') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="email">University Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="john.doe@univ.edu" value="{{ email or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
          <a href="{{ url_for('auth.forgot_password', role='student') }}" style="font-size: 0.8rem; font-weight: 500;">Forgot Password?</a>
        </div>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Sign In</button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
      Don't have a student account? <a href="{{ url_for('auth.student_register') }}" style="font-weight: 600;">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
