{% extends 'base.html' %}

{% block title %}Set New Password - Placement Portal{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div class="stat-icon green" style="margin: 0 auto 0.75rem auto;">🔐</div>
      <h1 class="page-title" style="font-size: 1.5rem;">Set New Password</h1>
      <p class="page-subtitle">Account: <strong>{{ user.email if user else '' }}</strong></p>
    </div>

    <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="password">New Password *</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm New Password *</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
